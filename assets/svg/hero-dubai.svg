<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dubai skyline at night with PA/VA network overlay">
  <defs>
    <linearGradient id="at-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040A14"/>
      <stop offset="0.5" stop-color="#080E1A"/>
      <stop offset="1" stop-color="#0C1525"/>
    </linearGradient>
    <radialGradient id="rg-skyblue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#0C1525" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0C1525" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg-orange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#F97316" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg-node-blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lg-haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111E35" stop-opacity="0"/>
      <stop offset="1" stop-color="#111E35" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="lg-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040A14" stop-opacity="0"/>
      <stop offset="1" stop-color="#040A14" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <!-- ======================= SKY ======================= -->
  <g id="sky">
    <rect x="0" y="0" width="1600" height="900" fill="url(#at-sky)"/>
    <ellipse cx="1300" cy="180" rx="680" ry="400" fill="url(#rg-skyblue)"/>
    <rect x="0" y="300" width="1600" height="600" fill="url(#lg-haze)"/>
    <!-- Stars -->
    <g fill="#A9CBE8">
      <circle cx="118"  cy="96"  r="1.1" opacity="0.20"/>
      <circle cx="236"  cy="182" r="0.9" opacity="0.14"/>
      <circle cx="342"  cy="64"  r="1.3" opacity="0.24"/>
      <circle cx="455"  cy="150" r="0.8" opacity="0.13"/>
      <circle cx="540"  cy="238" r="1.0" opacity="0.12"/>
      <circle cx="608"  cy="88"  r="1.2" opacity="0.22"/>
      <circle cx="702"  cy="196" r="0.9" opacity="0.15"/>
      <circle cx="778"  cy="52"  r="1.0" opacity="0.20"/>
      <circle cx="856"  cy="140" r="1.3" opacity="0.28"/>
      <circle cx="932"  cy="246" r="0.8" opacity="0.13"/>
      <circle cx="1004" cy="84"  r="1.1" opacity="0.26"/>
      <circle cx="1076" cy="176" r="0.9" opacity="0.18"/>
      <circle cx="1148" cy="46"  r="1.2" opacity="0.30"/>
      <circle cx="1210" cy="128" r="0.8" opacity="0.22"/>
      <circle cx="1286" cy="72"  r="1.4" opacity="0.34"/>
      <circle cx="1332" cy="208" r="0.9" opacity="0.20"/>
      <circle cx="1400" cy="112" r="1.1" opacity="0.28"/>
      <circle cx="1452" cy="40"  r="0.9" opacity="0.24"/>
      <circle cx="1502" cy="184" r="1.2" opacity="0.26"/>
      <circle cx="1556" cy="90"  r="1.0" opacity="0.22"/>
      <circle cx="1380" cy="278" r="0.8" opacity="0.14"/>
      <circle cx="1524" cy="300" r="0.9" opacity="0.13"/>
      <circle cx="60"   cy="210" r="0.9" opacity="0.12"/>
      <circle cx="668"  cy="300" r="0.8" opacity="0.10"/>
    </g>
  </g>

  <!-- ================== DIAMOND MOTIF ================== -->
  <g id="motif" stroke="#38BDF8" fill="none" stroke-width="1.2" transform="rotate(45 1260 200)">
    <rect x="1080" y="20"  width="360" height="360" opacity="0.07"/>
    <rect x="1126" y="66"  width="268" height="268" opacity="0.05"/>
    <rect x="1172" y="112" width="176" height="176" opacity="0.08"/>
    <rect x="1254" y="194" width="12"  height="12"  opacity="0.10"/>
  </g>

  <!-- ==================== ORANGE GLOW =================== -->
  <g id="glow">
    <ellipse cx="1230" cy="850" rx="600" ry="340" fill="url(#rg-orange)" opacity="0.22"/>
    <ellipse cx="1480" cy="885" rx="290" ry="170" fill="url(#rg-orange)" opacity="0.15"/>
  </g>

  <!-- ================== FAR SKYLINE (Dubai icons) ==================== -->
  <g id="far" fill="#0C1525">
    <!-- Burj Khalifa inspired spire -->
    <polygon points="796,130 800,520 792,520" fill="#111E35" opacity="0.9"/>
    <rect x="782" y="370" width="36" height="150" rx="2" fill="#0D1829" opacity="0.9"/>
    <rect x="770" y="460" width="60" height="60" rx="2" fill="#0D1829" opacity="0.9"/>
    <rect x="758" y="500" width="84" height="20" fill="#0D1829" opacity="0.9"/>
    <!-- Tower cluster left -->
    <rect x="580" y="410" width="60" height="110" rx="2"/>
    <rect x="560" y="440" width="30" height="80" rx="2" opacity="0.8"/>
    <rect x="650" y="390" width="44" height="130" rx="2"/>
    <rect x="700" y="420" width="52" height="100" rx="2" opacity="0.9"/>
    <!-- Tower cluster right -->
    <rect x="880" y="430" width="48" height="90" rx="2"/>
    <rect x="936" y="400" width="56" height="120" rx="2"/>
    <rect x="1000" y="450" width="40" height="70" rx="2" opacity="0.8"/>
    <rect x="1050" y="410" width="50" height="110" rx="2"/>
    <rect x="1110" y="430" width="60" height="90" rx="2" opacity="0.9"/>
    <!-- Far background towers -->
    <rect x="200" y="500" width="38" height="60" rx="1" opacity="0.5"/>
    <rect x="250" y="480" width="30" height="80" rx="1" opacity="0.5"/>
    <rect x="1300" y="490" width="42" height="70" rx="1" opacity="0.5"/>
    <rect x="1360" y="470" width="36" height="90" rx="1" opacity="0.5"/>
    <rect x="1420" y="500" width="50" height="60" rx="1" opacity="0.4"/>
  </g>

  <!-- ================== MID SKYLINE ==================== -->
  <g id="mid" fill="#0A121E">
    <rect x="100" y="550" width="50" height="100" rx="2"/>
    <rect x="160" y="530" width="40" height="120" rx="2"/>
    <rect x="320" y="540" width="60" height="110" rx="2"/>
    <rect x="390" y="520" width="44" height="130" rx="2"/>
    <rect x="440" y="545" width="36" height="105" rx="2" opacity="0.9"/>
    <!-- Mid towers with windows -->
    <rect x="500" y="510" width="68" height="140" rx="2"/>
    <rect x="735" y="520" width="30" height="130" rx="2"/>
    <rect x="850" y="530" width="22" height="120" rx="2" opacity="0.8"/>
    <rect x="1170" y="525" width="54" height="125" rx="2"/>
    <rect x="1240" y="510" width="44" height="140" rx="2"/>
    <rect x="1340" y="540" width="60" height="110" rx="2"/>
    <rect x="1480" y="530" width="50" height="120" rx="2" opacity="0.9"/>
    <rect x="1540" y="550" width="40" height="100" rx="2" opacity="0.8"/>
  </g>

  <!-- ================== NEAR SKYLINE ==================== -->
  <g id="near" fill="#070D18">
    <rect x="0"    y="660" width="90"  height="240" rx="0"/>
    <rect x="80"   y="630" width="70"  height="270" rx="0"/>
    <rect x="220"  y="650" width="80"  height="250" rx="0"/>
    <rect x="310"  y="610" width="60"  height="290" rx="0"/>
    <rect x="440"  y="640" width="100" height="260" rx="0"/>
    <rect x="550"  y="620" width="80"  height="280" rx="0"/>
    <rect x="640"  y="660" width="60"  height="240" rx="0"/>
    <rect x="940"  y="650" width="80"  height="250" rx="0"/>
    <rect x="1030" y="620" width="100" height="280" rx="0"/>
    <rect x="1140" y="640" width="70"  height="260" rx="0"/>
    <rect x="1220" y="610" width="90"  height="290" rx="0"/>
    <rect x="1380" y="630" width="80"  height="270" rx="0"/>
    <rect x="1470" y="660" width="70"  height="240" rx="0"/>
    <rect x="1560" y="640" width="40"  height="260" rx="0"/>
    <!-- Building windows near -->
    <g stroke="#1E3A5A" stroke-width="1" opacity="0.3">
      <rect x="234" y="680" width="8" height="10" rx="1" fill="#1E3A5A"/>
      <rect x="250" y="680" width="8" height="10" rx="1" fill="#1E3A5A"/>
      <rect x="234" y="700" width="8" height="10" rx="1" fill="#1E3A5A"/>
      <rect x="250" y="700" width="8" height="10" rx="1" fill="#1E3A5A"/>
      <rect x="458" y="670" width="10" height="12" rx="1" fill="#1E3A5A"/>
      <rect x="475" y="670" width="10" height="12" rx="1" fill="#1E3A5A"/>
      <rect x="458" y="692" width="10" height="12" rx="1" fill="#1E3A5A"/>
    </g>
    <!-- Animated lit windows -->
    <g opacity="0.35">
      <rect x="322" y="640" width="8" height="10" rx="1" fill="#38BDF8"/>
      <rect x="338" y="640" width="8" height="10" rx="1" fill="#38BDF8" opacity="0.5"/>
      <rect x="322" y="660" width="8" height="10" rx="1" fill="#F97316" opacity="0.7"/>
      <rect x="956" y="670" width="8" height="10" rx="1" fill="#38BDF8"/>
      <rect x="972" y="670" width="8" height="10" rx="1" fill="#38BDF8" opacity="0.4"/>
      <rect x="1044" y="650" width="10" height="12" rx="1" fill="#F97316" opacity="0.5"/>
    </g>
    <!-- PA/VA antenna on Burj area -->
    <circle cx="798" cy="128" r="6" fill="url(#rg-node-blue)" opacity="0.9"/>
    <circle cx="798" cy="128" r="2.5" fill="#38BDF8"/>
  </g>

  <!-- ================== NETWORK OVERLAY ==================== -->
  <g id="network" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" opacity="0.45">
    <path d="M140 610 L280 580 L420 600 L560 565 L700 590" stroke-dasharray="3 7"/>
    <path d="M700 590 L800 540 L900 570 L1050 545 L1200 580" stroke-dasharray="3 7"/>
    <path d="M1200 580 L1350 560 L1480 590" stroke-dasharray="3 7"/>
    <path d="M420 600 L420 520 L550 490 L700 510" stroke-dasharray="2 8" opacity="0.6"/>
    <path d="M900 570 L900 490 L1050 470 L1200 500" stroke-dasharray="2 8" opacity="0.6"/>
    <!-- Network nodes -->
    <circle cx="140"  cy="610" r="14" fill="url(#rg-node-blue)" stroke="none" opacity="0.5"/>
    <circle cx="140"  cy="610" r="3.5" fill="#0D1829" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="280"  cy="580" r="3.5" fill="#0D1829" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="420"  cy="600" r="14" fill="url(#rg-node-blue)" stroke="none" opacity="0.5"/>
    <circle cx="420"  cy="600" r="3.5" fill="#0D1829" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="560"  cy="565" r="3.5" fill="#0D1829" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="700"  cy="590" r="3.5" fill="#0D1829" stroke="#F97316" stroke-width="1.5"/>
    <circle cx="800"  cy="540" r="14" fill="url(#rg-node-blue)" stroke="none" opacity="0.5"/>
    <circle cx="800"  cy="540" r="3.5" fill="#0D1829" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="900"  cy="570" r="3.5" fill="#0D1829" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="1050" cy="545" r="3.5" fill="#0D1829" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="1200" cy="580" r="14" fill="url(#rg-node-blue)" stroke="none" opacity="0.5"/>
    <circle cx="1200" cy="580" r="3.5" fill="#0D1829" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="1350" cy="560" r="3.5" fill="#0D1829" stroke="#F97316" stroke-width="1.5"/>
    <circle cx="1480" cy="590" r="3.5" fill="#0D1829" stroke="#38BDF8" stroke-width="1.5"/>
  </g>

  <!-- =================== GROUND FADE ==================== -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#lg-ground)"/>

</svg>
