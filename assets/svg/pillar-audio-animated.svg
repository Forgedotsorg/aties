<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="au-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111E35" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0C1525" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="au-nodeglow">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes networkFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodeBreathe {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes dataPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    
    .net-line {
      stroke-dasharray: 6 6;
      animation: networkFlow 2s linear infinite;
    }
    .node-glow {
      animation: nodeBreathe 3s infinite ease-in-out;
      transform-origin: center;
    }
    .data-dot {
      animation: dataPulse 1.5s infinite alternate;
    }
  </style>

  <!-- Network / IP nodes -->
  <g id="au-network" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round">
    <path d="M70 252 L134 264 L198 248 L252 236" opacity="0.3"/>
    <path d="M142 62 L190 42 L242 50" opacity="0.3"/>
    <path d="M322 156 L352 122 L352 78" opacity="0.3"/>
    
    <!-- Animated Network streams -->
    <path class="net-line" d="M70 252 L134 264 L198 248 L252 236" stroke="#38BDF8"/>
    <path class="net-line" d="M142 62 L190 42 L242 50" stroke="#38BDF8"/>

    <!-- Nodes with breathing glows -->
    <g transform="translate(70,252)"><circle class="node-glow" r="10" fill="url(#au-nodeglow)" stroke="none"/><circle r="3" fill="#0C1525" stroke="#38BDF8"/></g>
    <g transform="translate(134,264)"><circle class="node-glow" style="animation-delay: 1s;" r="10" fill="url(#au-nodeglow)" stroke="none"/><circle r="3" fill="#0C1525" stroke="#38BDF8"/></g>
    <g transform="translate(198,248)"><circle class="node-glow" style="animation-delay: 2s;" r="10" fill="url(#au-nodeglow)" stroke="none"/><circle r="3" fill="#0C1525" stroke="#38BDF8"/></g>
    <g transform="translate(190,42)"><circle class="node-glow" r="10" fill="url(#au-nodeglow)" stroke="none"/><circle r="3" fill="#0C1525" stroke="#38BDF8"/></g>
    <g transform="translate(242,50)"><circle class="node-glow" style="animation-delay: 1.5s;" r="10" fill="url(#au-nodeglow)" stroke="none"/><circle r="3" fill="#0C1525" stroke="#38BDF8"/></g>
  </g>

  <!-- Pro Audio DSP Module -->
  <g id="au-dsp">
    <rect x="56" y="64" width="86" height="40" rx="8" fill="url(#au-glass)" stroke="#0EA5E9" stroke-width="1.5"/>
    <circle cx="70" cy="84" r="4" fill="#38BDF8" class="data-dot"/>
    <path d="M84 76 h30 M84 84 h40 M84 92 h20" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Network Switch -->
  <g id="au-switch">
    <rect x="252" y="140" width="70" height="100" rx="10" fill="url(#au-glass)" stroke="#0EA5E9" stroke-width="1.5"/>
    <rect x="262" y="150" width="50" height="62" rx="6" stroke="#094E72" stroke-width="1.5" opacity="0.6"/>
    <!-- Switch Ports -->
    <rect x="268" y="158" width="16" height="12" rx="2" stroke="#38BDF8" stroke-width="1" fill="#0C1525"/>
    <rect x="290" y="158" width="16" height="12" rx="2" stroke="#38BDF8" stroke-width="1" fill="#0C1525"/>
    <rect x="268" y="176" width="16" height="12" rx="2" stroke="#38BDF8" stroke-width="1" fill="#0C1525"/>
    <rect x="290" y="176" width="16" height="12" rx="2" stroke="#38BDF8" stroke-width="1" fill="#0C1525"/>
    <!-- Flashing Ports -->
    <circle cx="276" cy="164" r="2" fill="#38BDF8" class="data-dot"/>
    <circle cx="298" cy="182" r="2" fill="#38BDF8" class="data-dot" style="animation-delay: 0.5s;"/>
  </g>
</svg>
