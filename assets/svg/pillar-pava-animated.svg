<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="pv-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111E35" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0C1525" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="pv-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes eqBounce {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }
    @keyframes dataFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes soundWave {
      0% { opacity: 0.8; transform: scale(0.8) translateX(0); }
      100% { opacity: 0; transform: scale(1.3) translateX(10px); }
    }
    
    .eq {
      transform-origin: bottom;
      animation: eqBounce 1s infinite alternate ease-in-out;
    }
    .eq:nth-child(2) { animation-duration: 1.2s; animation-delay: 0.1s; }
    .eq:nth-child(3) { animation-duration: 0.9s; animation-delay: 0.2s; }
    .eq:nth-child(4) { animation-duration: 1.1s; animation-delay: 0.3s; }
    .eq:nth-child(5) { animation-duration: 1.3s; animation-delay: 0.4s; }

    .data-line {
      stroke-dasharray: 6 6;
      animation: dataFlow 2s linear infinite;
    }

    .wave {
      animation: soundWave 2s infinite ease-out;
    }
    .w-top { transform-origin: 290px 70px; }
    .w-mid { transform-origin: 290px 150px; animation-delay: 0.5s; }
    .w-bot { transform-origin: 290px 230px; animation-delay: 1s; }
  </style>

  <!-- Ambience crosshairs (+) -->
  <g id="pv-ambience" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" opacity="0.35">
    <path d="M30 260 v8 M26 264 h8"/>
    <path d="M360 40 v8 M356 44 h8"/>
  </g>

  <!-- Wiring (Star Topology) -->
  <g id="pv-wiring" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round">
    <!-- Static background paths -->
    <path d="M120 150 H180 V70 H250" opacity="0.4"/>
    <path d="M120 150 H250" opacity="0.4"/>
    <path d="M120 150 H180 V230 H250" opacity="0.4"/>
    
    <!-- Animated flowing data lines -->
    <path class="data-line" d="M120 150 H180 V70 H250"/>
    <path class="data-line" d="M120 150 H250"/>
    <path class="data-line" d="M120 150 H180 V230 H250"/>
    
    <!-- Nodes at splits -->
    <circle cx="180" cy="150" r="2.5" fill="#38BDF8"/>
    <circle cx="120" cy="150" r="2.5" fill="#38BDF8"/>
    <circle cx="250" cy="70" r="2.5" fill="#38BDF8"/>
    <circle cx="250" cy="150" r="2.5" fill="#38BDF8"/>
    <circle cx="250" cy="230" r="2.5" fill="#38BDF8"/>
  </g>

  <!-- Central PA/VA Rack -->
  <g id="pv-rack">
    <!-- Main chassis -->
    <rect x="40" y="80" width="80" height="140" rx="6" fill="url(#pv-glass)" stroke="#0EA5E9" stroke-width="1.5"/>
    
    <!-- Display Screen -->
    <rect x="48" y="92" width="64" height="40" rx="4" fill="#0C1525" stroke="#094E72" stroke-width="1.5"/>
    <!-- EQ Bars -->
    <g stroke="#38BDF8" stroke-width="3" stroke-linecap="round">
      <path class="eq" d="M58 122 v-12"/>
      <path class="eq" d="M68 122 v-20"/>
      <path class="eq" d="M78 122 v-8"/>
      <path class="eq" d="M88 122 v-16"/>
      <path class="eq" d="M98 122 v-14"/>
    </g>

    <!-- Amplifier modules / Zone buttons -->
    <rect x="48" y="145" width="64" height="20" rx="3" stroke="#094E72" stroke-width="1.5" opacity="0.6"/>
    <circle cx="56" cy="155" r="3" fill="#38BDF8"/>
    <circle cx="68" cy="155" r="3" fill="#0C1525" stroke="#0EA5E9"/>
    
    <rect x="48" y="172" width="64" height="20" rx="3" stroke="#094E72" stroke-width="1.5" opacity="0.6"/>
    <circle cx="56" cy="182" r="3" fill="#38BDF8"/>
    <circle cx="68" cy="182" r="3" fill="#0C1525" stroke="#0EA5E9"/>
    
    <!-- Master Alert Button/LED -->
    <rect x="48" y="199" width="64" height="12" rx="2" fill="#0C1525"/>
    <circle cx="102" cy="205" r="3" fill="url(#pv-orange)"/>
  </g>

  <!-- Zone 1: Ceiling Speaker -->
  <g id="pv-spk-ceiling">
    <rect x="250" y="50" width="40" height="40" rx="6" fill="url(#pv-glass)" stroke="#0EA5E9" stroke-width="1.5"/>
    <path d="M260 70 A10 10 0 0 1 280 70" stroke="#E8F4FD" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M255 70 H285" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Sound Wave -->
    <g class="wave w-top" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M295 60 Q305 70 295 80"/>
      <path d="M302 54 Q316 70 302 86" opacity="0.5"/>
    </g>
  </g>

  <!-- Zone 2: Column Speaker -->
  <g id="pv-spk-column">
    <rect x="250" y="130" width="40" height="40" rx="6" fill="url(#pv-glass)" stroke="#0EA5E9" stroke-width="1.5"/>
    <rect x="264" y="138" width="12" height="24" rx="2" stroke="#E8F4FD" stroke-width="1.5" fill="none"/>
    <circle cx="270" cy="144" r="1.5" fill="#38BDF8"/>
    <circle cx="270" cy="150" r="1.5" fill="#38BDF8"/>
    <circle cx="270" cy="156" r="1.5" fill="#38BDF8"/>
    <!-- Sound Wave -->
    <g class="wave w-mid" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M295 140 Q305 150 295 160"/>
      <path d="M302 134 Q316 150 302 166" opacity="0.5"/>
    </g>
  </g>

  <!-- Zone 3: Horn Speaker -->
  <g id="pv-spk-horn">
    <rect x="250" y="210" width="40" height="40" rx="6" fill="url(#pv-glass)" stroke="#0EA5E9" stroke-width="1.5"/>
    <path d="M262 226 L278 218 V242 L262 234 Z" stroke="#E8F4FD" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
    <circle cx="260" cy="230" r="2" fill="#38BDF8"/>
    <!-- Sound Wave -->
    <g class="wave w-bot" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M295 220 Q305 230 295 240"/>
      <path d="M302 214 Q316 230 302 246" opacity="0.5"/>
    </g>
  </g>
</svg>
